<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Readeez logo, and the one master drawing of it: an open book with a gold ribbon on an amber tile.
    Every icon in this folder is generated from this file by scripts/make-icons.mjs, so change the logo here and
    re-run that script instead of editing a PNG. The ids below are how the script finds each part.
  -->
  <defs>
    <!-- The tile's colour: lighter amber at the top left, fading to deep amber at the bottom right. -->
    <linearGradient id="tile-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0691A"/>
      <stop offset="1" stop-color="#6F3F0B"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="512" height="512" rx="112" fill="url(#tile-gradient)"/>
  <path id="left-page" fill="#FFF8EC" d="M256 158c-40-30-104-40-164-28-8 2-14 9-14 17v206c0 11 10 19 21 17 54-10 112-2 157 28z"/>
  <path id="right-page" fill="#FFF8EC" opacity=".84" d="M256 158c40-30 104-40 164-28 8 2 14 9 14 17v206c0 11-10 19-21 17-54-10-112-2-157-28z"/>
  <path id="ribbon" fill="#E8B25E" d="M326 121v122l31-25 31 25V124c-21-4-42-5-62-3z"/>
</svg>
